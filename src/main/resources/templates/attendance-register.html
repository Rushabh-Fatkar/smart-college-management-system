<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/dashboard">
            Smart College Management System
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/students">Students</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/faculty">Faculty</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/courses">Courses</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/attendance">Attendance</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning" href="/logout">Logout</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h3>Attendance Registration</h3>
                </div>

                <div class="card-body">
					<div th:if="${error}" class="alert alert-danger">
					    <span th:text="${error}"></span>
					</div>
                    <form th:action="@{/saveAttendance}" th:object="${attendance}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{studentName}"
                                   placeholder="Enter Student Name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>

                            <select class="form-select"
                                    th:field="*{status}"
                                    required>

                                <option value="">Select Status</option>
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>

                            </select>

                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Save Attendance
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

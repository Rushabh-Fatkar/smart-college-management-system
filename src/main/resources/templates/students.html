<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/dashboard">
            Smart College Management System
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/students">Students</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/faculty">Faculty</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/courses">Courses</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/attendance">Attendance</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning" href="/logout">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-4 text-center">Students List</h2>

    <div class="mb-3">

        <input type="text"
               id="searchInput"
               class="form-control"
               placeholder="Search Student by Name">

    </div>

    <table class="table table-bordered table-striped shadow">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>Attendance %</th>
                <th width="180">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="student : ${students}">

                <td th:text="${student.id}"></td>

                <td th:text="${student.name}"></td>

                <td th:text="${student.course}"></td>

                <td th:text="${student.email}"></td>

                <td th:text="${student.mobile}"></td>

                <td>

                    <span class="badge bg-success"
                          th:if="${attendancePercentage[student.name] >= 75}"
                          th:text="${#numbers.formatDecimal(attendancePercentage[student.name],1,2)} + '%'">
                    </span>

                    <span class="badge bg-warning text-dark"
                          th:if="${attendancePercentage[student.name] >= 50 && attendancePercentage[student.name] < 75}"
                          th:text="${#numbers.formatDecimal(attendancePercentage[student.name],1,2)} + '%'">
                    </span>

                    <span class="badge bg-danger"
                          th:if="${attendancePercentage[student.name] < 50}"
                          th:text="${#numbers.formatDecimal(attendancePercentage[student.name],1,2)} + '%'">
                    </span>

                </td>

                <td>

                    <div th:if="${session.role == 'ADMIN' or session.role == 'FACULTY'}">

                        <a th:href="@{/editStudent/{id}(id=${student.id})}"
                           class="btn btn-warning btn-sm">

                            Edit

                        </a>

                        <a th:href="@{/deleteStudent/{id}(id=${student.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this student?')">

                            Delete

                        </a>

                    </div>

                    <span th:if="${session.role == 'STUDENT'}"
                          class="text-muted">

                        View Only

                    </span>

                </td>

            </tr>

        </tbody>

    </table>

</div>

<script>

document.getElementById("searchInput").addEventListener("keyup", function () {

    let filter = this.value.toLowerCase();

    let rows = document.querySelectorAll("table tbody tr");

    rows.forEach(function (row) {

        let name = row.cells[1].textContent.toLowerCase();

        if (name.includes(filter)) {

            row.style.display = "";

        } else {

            row.style.display = "none";

        }

    });

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

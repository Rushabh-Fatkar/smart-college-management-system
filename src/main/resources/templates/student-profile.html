<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile | Smart College</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">
                Student Portal
            </h4>

        </div>

        <div class="card-body">

            <h5>Welcome Student 👋</h5>

            <p class="text-muted">
                You can view your student profile and attendance details.
            </p>

            <div class="row mt-4">

                <!-- Profile -->

                <div class="col-md-4 mb-3">

                    <div class="card shadow-sm">

                        <div class="card-body text-center">

                            <h5>👤 Profile</h5>

                            <p>
                                View your student profile
                            </p>

                            <button class="btn btn-primary">
                                View Profile
                            </button>

                        </div>

                    </div>

                </div>


                <!-- Attendance -->

                <div class="col-md-4 mb-3">

                    <div class="card shadow-sm">

                        <div class="card-body text-center">

                            <h5>📅 Attendance</h5>

                            <p>
                                View your attendance
                            </p>

                            <a href="/student-attendance"
                               class="btn btn-success">

                                View Attendance

                            </a>

                        </div>

                    </div>

                </div>


                <!-- Attendance Percentage -->

                <div class="col-md-4 mb-3">

                    <div class="card shadow-sm">

                        <div class="card-body text-center">

                            <h5>📊 Attendance %</h5>

                            <p>
                                Check your attendance percentage
                            </p>

                            <a href="/student-attendance"
                               class="btn btn-warning">

                                View Percentage

                            </a>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Logout -->

            <div class="text-center mt-4">

                <a href="/logout"
                   class="btn btn-danger">

                    Logout

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>

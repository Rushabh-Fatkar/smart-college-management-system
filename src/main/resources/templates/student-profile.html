<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile | Smart College</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: #f4f7fb;
        }

        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .portal-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .portal-header {
            padding: 20px;
        }

        .portal-header h4 {
            margin: 0;
            font-weight: 600;
        }

        .welcome-section {
            padding: 10px 5px;
        }

        .welcome-section h5 {
            font-weight: 600;
        }

        .feature-card {
            height: 100%;
            border: none;
            border-radius: 15px;
            transition: 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-4px);
        }

        .feature-card .card-body {
            padding: 25px 20px;
        }

        .feature-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .feature-card h5 {
            font-weight: 600;
        }

        .feature-card p {
            min-height: 48px;
        }

        .action-btn {
            width: 100%;
            max-width: 180px;
        }

        .profile-info {
            text-align: left;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
        }

        .profile-info p {
            margin-bottom: 8px;
            min-height: auto;
        }

        .profile-label {
            font-weight: 600;
        }

        .logout-btn {
            min-width: 120px;
        }

        @media (max-width: 576px) {

            .main-container {
                margin-top: 15px;
                padding: 0 10px;
            }

            .portal-header {
                padding: 16px;
            }

            .portal-header h4 {
                font-size: 20px;
            }

            .portal-card .card-body {
                padding: 18px 12px;
            }

            .welcome-section h5 {
                font-size: 19px;
            }

            .welcome-section p {
                font-size: 14px;
            }

            .feature-card .card-body {
                padding: 22px 15px;
            }

            .feature-icon {
                font-size: 32px;
            }

            .feature-card h5 {
                font-size: 18px;
            }

            .feature-card p {
                min-height: auto;
                font-size: 14px;
            }

            .action-btn {
                max-width: 100%;
            }

            .logout-btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="main-container">

        <div class="card shadow portal-card">

            <!-- Header -->

            <div class="card-header bg-primary text-white portal-header">

                <h4>
                    Student Portal
                </h4>

            </div>


            <div class="card-body">

                <!-- Welcome -->

                <div class="welcome-section">

                    <h5>
                        Welcome, <span th:text="${student.name}">Student</span> 👋
                    </h5>

                    <p class="text-muted mb-0">
                        Welcome to your Smart College student portal.
                    </p>

                </div>


                <!-- Features -->

                <div class="row g-3 mt-3">

                    <!-- Profile -->

                    <div class="col-12 col-md-4">

                        <div class="card shadow-sm feature-card">

                            <div class="card-body text-center">

                                <div class="feature-icon">
                                    👤
                                </div>

                                <h5>
                                    Profile
                                </h5>

                                <div class="profile-info mt-3">

                                    <p>
                                        <span class="profile-label">Name:</span>
                                        <span th:text="${student.name}"></span>
                                    </p>

                                    <p>
                                        <span class="profile-label">Email:</span>
                                        <span th:text="${student.email}"></span>
                                    </p>

                                    <p>
                                        <span class="profile-label">Mobile:</span>
                                        <span th:text="${student.mobile}"></span>
                                    </p>

                                    <p>
                                        <span class="profile-label">Course:</span>
                                        <span th:text="${student.course}"></span>
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- Attendance -->

                    <div class="col-12 col-md-4">

                        <div class="card shadow-sm feature-card">

                            <div class="card-body text-center">

                                <div class="feature-icon">
                                    📅
                                </div>

                                <h5>
                                    Attendance
                                </h5>

                                <p class="text-muted">
                                    View your attendance
                                </p>

                                <a href="/student-attendance"
                                   class="btn btn-success action-btn">

                                    View Attendance

                                </a>

                            </div>

                        </div>

                    </div>


                    <!-- Attendance Percentage -->

                    <div class="col-12 col-md-4">

                        <div class="card shadow-sm feature-card">

                            <div class="card-body text-center">

                                <div class="feature-icon">
                                    📊
                                </div>

                                <h5>
                                    Attendance %
                                </h5>

                                <p class="text-muted">
                                    Check your attendance percentage
                                </p>

                                <a href="/student-attendance"
                                   class="btn btn-warning action-btn">

                                    View Percentage

                                </a>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- Logout -->

                <div class="text-center mt-4">

                    <a href="/logout"
                       class="btn btn-danger logout-btn">

                        Logout

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>

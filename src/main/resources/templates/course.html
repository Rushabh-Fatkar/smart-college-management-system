<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/dashboard">
            Smart College Management System
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/students">Students</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/faculty">Faculty</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/courses">Courses</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/attendance">Attendance</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-warning" href="/logout">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Course List</h2>

        <a href="/course-register"
           class="btn btn-primary"
           th:if="${session.role == 'ADMIN' or session.role == 'FACULTY'}">

            Add Course

        </a>

    </div>

    <table class="table table-bordered table-striped table-hover shadow">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Course Name</th>
                <th>Course Code</th>
                <th>Department</th>
                <th>Duration</th>
                <th width="180">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr th:each="course : ${courseList}">

                <td th:text="${course.id}"></td>

                <td th:text="${course.courseName}"></td>

                <td th:text="${course.courseCode}"></td>

                <td th:text="${course.department}"></td>

                <td th:text="${course.duration}"></td>

                <td>

                    <div th:if="${session.role == 'ADMIN' or session.role == 'FACULTY'}">

                        <a th:href="@{/editCourse/{id}(id=${course.id})}"
                           class="btn btn-warning btn-sm">

                            Edit

                        </a>

                        <a th:href="@{/deleteCourse/{id}(id=${course.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this course?')">

                            Delete

                        </a>

                    </div>

                    <span th:if="${session.role == 'STUDENT'}"
                          class="text-muted">

                        View Only

                    </span>

                </td>

            </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>

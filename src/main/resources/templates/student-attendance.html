<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">Student Attendance</h4>

        </div>

        <div class="card-body">

            <div class="alert alert-info">

                <strong>Student:</strong>
                <span th:text="${studentName}">Student Name</span>

            </div>

            <div class="row mb-4">

                <div class="col-md-4">

                    <div class="card text-center shadow-sm">

                        <div class="card-body">

                            <h6>Total Lectures</h6>

                            <h3 th:text="${totalAttendance}">0</h3>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card text-center shadow-sm">

                        <div class="card-body">

                            <h6>Present</h6>

                            <h3 class="text-success"
                                th:text="${presentAttendance}">0</h3>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card text-center shadow-sm">

                        <div class="card-body">

                            <h6>Attendance %</h6>

                            <h3 class="text-primary"
                                th:text="${attendancePercentage + '%'}">0%</h3>

                        </div>

                    </div>

                </div>

            </div>

            <table class="table table-bordered table-striped table-hover">

                <thead class="table-primary">

                    <tr>

                        <th>Student Name</th>
                        <th>Course</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Attendance %</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="attendance : ${attendanceList}">

                        <td th:text="${attendance.studentName}"></td>

                        <td th:text="${attendance.courseName}"></td>

                        <td th:text="${attendance.date}"></td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${attendance.status == 'Present'}"
                                  th:text="${attendance.status}">
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${attendance.status == 'Absent'}"
                                  th:text="${attendance.status}">
                            </span>

                        </td>

                        <td th:text="${attendancePercentage + '%'}"></td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(attendanceList)}">

                        <td colspan="5"
                            class="text-center text-muted">

                            No attendance records found.

                        </td>

                    </tr>

                </tbody>

            </table>

            <a href="/student-profile"
               class="btn btn-secondary">

                Back to Profile

            </a>

            <a href="/logout"
               class="btn btn-danger float-end">

                Logout

            </a>

        </div>

    </div>

</div>

</body>

</html>
